[package]
name = "schemapin-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"

[dependencies.schemapin]
path = ".."

[[bin]]
name = "canonicalize"
path = "fuzz_targets/canonicalize.rs"
test = false
doc = false

[[bin]]
name = "txt_record"
path = "fuzz_targets/txt_record.rs"
test = false
doc = false

[[bin]]
name = "skill_signature"
path = "fuzz_targets/skill_signature.rs"
test = false
doc = false

[[bin]]
name = "bundle"
path = "fuzz_targets/bundle.rs"
test = false
doc = false

[[bin]]
name = "pem_loader"
path = "fuzz_targets/pem_loader.rs"
test = false
doc = false
